# mail-spray-guard — failed IMAP/POP3 (Dovecot) and SMTP AUTH (Postfix) logins.
# One line per failed attempt; the jail decides how many count.
#
# To protect only some domains, replace (?:[^>@\s]+) below with e.g. (?:example\.com|example\.org).

[INCLUDES]
before = common.conf

[Definition]
_domain = (?:[^>@\s]+)

failregex = dovecot(?:\[\d+\])?: (?:imap|pop3|submission|managesieve)-login: .*(?:auth failed|Authentication failed|Aborted login).*user=<[^>@]*@%(_domain)s>.*rip=<HOST>,
            postfix/[^\[]+\[\d+\]: warning: [^\[]*\[<HOST>\]: SASL (?:LOGIN|PLAIN|CRAM-MD5|\S+) authentication failed.*sasl_username=[^@\s]+@%(_domain)s

ignoreregex =
